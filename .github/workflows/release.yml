name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 12
        run: npm install -g npm@12.2.1

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/agentquake/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match agentquake $version. Tag it v$version."
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck -w agentquake

      - name: Unit tests
        run: npm test -w agentquake

      - name: Build
        run: npm run build -w agentquake

      - name: Check that npm accepts the package manifest
        working-directory: packages/agentquake
        run: |
          output=$(npm publish --dry-run --tag check 2>&1)
          if grep -q "auto-corrected" <<<"$output"; then
            grep -A5 "auto-corrected" <<<"$output"
            echo "::error::npm would change package.json while publishing. Run npm pkg fix -w agentquake."
            exit 1
          fi

      - name: Stage the release on npm
        working-directory: packages/agentquake
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm stage publish . --access public --tag next
          else
            npm stage publish . --access public
          fi
