name: agentquake

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agentquake
      POSTGRES_PASSWORD: agentquake
      POSTGRES_DB: agentquake
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentquake -d agentquake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: